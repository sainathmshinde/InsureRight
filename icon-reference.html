<meta charset="UTF-8"/>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --brand:#7c3aed;--brand-light:#ede9fe;--brand-mid:#a78bfa;
    --bg:#f5f4f9;--surface:#fff;--border:#e8e4f0;
    --text:#1a1628;--text-2:#5c5573;--text-3:#9d94b8;
    --r:10px;
  }
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);padding:32px 40px;}
  h1{font-size:26px;font-weight:700;color:var(--text);margin-bottom:4px}
  .sub{font-size:14px;color:var(--text-3);margin-bottom:32px}
  .section{margin-bottom:36px}
  .section-title{
    font-size:11px;font-weight:700;color:var(--brand);
    text-transform:uppercase;letter-spacing:.8px;
    border-bottom:1.5px solid var(--brand-light);
    padding-bottom:8px;margin-bottom:16px;
  }
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
  .icon-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--r);padding:16px 12px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:pointer;transition:border-color .15s,background .15s;
    user-select:none;
  }
  .icon-card:hover{border-color:var(--brand-mid);background:var(--brand-light)}
  .icon-card:active{transform:scale(.97)}
  .icon-wrap{
    width:44px;height:44px;border-radius:8px;
    background:var(--brand-light);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-name{font-size:11.5px;color:var(--text-2);text-align:center;line-height:1.3;font-family:'DM Mono',monospace}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#1e1133;color:#fff;padding:10px 20px;
    border-radius:8px;font-size:13px;font-weight:500;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;
  }
  .toast.show{opacity:1}
  .search-wrap{margin-bottom:24px}
  .search-input{
    width:320px;height:40px;padding:0 14px;
    border:1.5px solid var(--border);border-radius:8px;
    background:#fff;font-size:13.5px;font-family:inherit;
    outline:none;color:var(--text);
  }
  .search-input:focus{border-color:var(--brand)}
</style>
</head>

<div class="search-wrap">

function svgCard(name, key, path) {
  const paths = path.split(' M ').map((p,i) => i===0?p:'M '+p)
  const pathEls = paths.map(p => `<path d="${p}" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`).join('')
  return `
    <div class="icon-card" data-name="${name.toLowerCase()} ${key}" onclick="copyName('${name}')">
      <div class="icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          ${pathEls}
        </svg>
      </div>
      <span class="icon-name">${name}</span>
    </div>`
}

function render(filter='') {
  const root = document.getElementById('root')
  let html = ''
  for (const [section, icons] of Object.entries(ICONS)) {
    const filtered = filter
      ? icons.filter(([n,k]) => n.toLowerCase().includes(filter) || k.includes(filter))
      : icons
    if (filtered.length === 0) continue
    html += `<div class="section"><div class="section-title">${section} (${filtered.length})</div><div class="grid">`
    filtered.forEach(([n,k,p]) => { html += svgCard(n,k,p) })
    html += `</div></div>`
  }
  root.innerHTML = html || '<p style="color:var(--text-3);padding:20px">No icons match your search.</p>'
}

function filterIcons(v) { render(v.toLowerCase().trim()) }

function copyName(name) {
  navigator.clipboard.writeText(name).catch(()=>{})
  const t = document.getElementById('toast')
  t.textContent = `Copied: ${name}`
  t.classList.add('show')
  setTimeout(() => t.classList.remove('show'), 2000)
}

render()
